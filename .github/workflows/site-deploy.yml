name: Site Deploy

# Reusable deploy for a site repo built on spa-platform: build the site, upload it with tools/deploy, smoke-test it.
# The deploy tool runs from the same spa-platform commit as this workflow (job.workflow_sha), so pinning the workflow
# pins the tool. Call it from the site's own workflow on pushes to main:
#
#   concurrency:
#     group: deploy-production
#     cancel-in-progress: false
#
#   jobs:
#     deploy:
#       uses: arsw-dev/spa-platform/.github/workflows/site-deploy.yml@<release commit SHA> # vX.Y.Z
#       permissions:
#         contents: read
#         id-token: write
#
# The deploy job runs in the `environment` (default production), which must only allow the default branch, and reads
# AWS_DEPLOY_ROLE_ARN, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID and SITE_URL from that environment's variables.

on:
  workflow_call:
    inputs:
      site-package:
        description: pnpm workspace package that builds the site
        type: string
        default: site
      dist-dir:
        description: The site's build output directory
        type: string
        default: site/dist
      environment:
        description: GitHub environment holding the deploy variables (and trusted by the deploy role)
        type: string
        default: production
      node-version:
        type: string
        default: '24'
      aws-region:
        type: string
        default: us-east-1

permissions:
  contents: read

defaults:
  run:
    # Explicit bash gets -o pipefail; the implicit default shell doesn't
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Site
        env:
          SITE_PACKAGE: ${{ inputs.site-package }}
        run: pnpm --filter "$SITE_PACKAGE" build

      - name: Upload Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: ${{ inputs.dist-dir }}
          # .well-known/ files and Vite's .vite/manifest.json are hidden and skipped by default
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    # Only this job can mint an OIDC token; the build job runs the site's whole npm tree and never needs one
    permissions:
      id-token: write
      contents: read

    steps:
      # Without these, checkout would silently fall back to spa-platform's default branch: an unpinned deploy tool
      - name: Check Platform Version
        env:
          PLATFORM_REPOSITORY: ${{ job.workflow_repository }}
          PLATFORM_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$PLATFORM_REPOSITORY" ] || [ -z "$PLATFORM_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are empty; refusing to deploy with an unpinned deploy tool"
            exit 1
          fi
          echo "Deploy tool: $PLATFORM_REPOSITORY@$PLATFORM_SHA"

      - name: Check Out Deploy Tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .platform
          persist-credentials: false

      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .platform/package.json

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: .platform/pnpm-lock.yaml

      - name: Install Deploy Tool
        run: pnpm --dir .platform install --frozen-lockfile --filter deploy

      - name: Download Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: ${{ inputs.dist-dir }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy
        env:
          DIST_DIR: ${{ inputs.dist-dir }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: node .platform/tools/deploy/src/deploy.ts "$DIST_DIR"

      - name: Smoke Test
        env:
          DIST_DIR: ${{ inputs.dist-dir }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node .platform/tools/deploy/src/smoke.ts "$DIST_DIR"
