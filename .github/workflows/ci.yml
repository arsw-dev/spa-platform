name: CI

# One workflow, one required check (CI Result). Everything runs on every PR. Within a job, checks keep running
# after one fails so a single run reports every failure. There's no Plan job: this repo manages no
# infrastructure; site repos plan against real accounts using these modules.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Explicit bash gets -o pipefail; without it `terraform plan | tee` passes even when the plan fails
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck Tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter './tools/*' typecheck

      - name: Test Tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter './tools/*' test

      - name: Test CloudFront Function
        if: ${{ !cancelled() }}
        run: node --test "modules/static-site/functions/*.test.ts"

      - name: Lint CloudFormation
        if: ${{ !cancelled() }}
        run: pipx run --spec cfn-lint==1.57.0 cfn-lint cloudformation/*.yaml

      - name: Install Workflow Linter
        id: actionlint
        if: ${{ !cancelled() }}
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum --check
          tar xzf actionlint.tar.gz actionlint

      - name: Lint Workflows
        if: ${{ !cancelled() && steps.actionlint.outcome == 'success' }}
        run: ./actionlint -color

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Exact version: must match the Terraform used for local applies (setup-terraform treats ~> as npm-style ~, i.e. patch-only)
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Check Formatting
        run: terraform fmt -check -recursive modules

      - name: Test Static Site Module
        if: ${{ !cancelled() }}
        working-directory: modules/static-site
        run: |
          terraform init -backend=false -input=false
          terraform test

      # terraform test compares values, and a validated certificate's ARN equals the unvalidated one, so the rule
      # that CloudFront waits for validation is checked on the dependency graph instead
      - name: Check CloudFront Waits for Certificate Validation
        if: ${{ !cancelled() }}
        working-directory: modules/static-site
        run: |
          if ! terraform graph | grep -qF '"aws_cloudfront_distribution.this" -> "aws_acm_certificate_validation.this"'; then
            echo "::error::aws_cloudfront_distribution.this must take its certificate from aws_acm_certificate_validation.this"
            exit 1
          fi

      - name: Test Cloudflare DNS Module
        if: ${{ !cancelled() }}
        working-directory: modules/cloudflare-dns
        run: |
          terraform init -backend=false -input=false
          terraform test

      - name: Test Account Bootstrap Module
        if: ${{ !cancelled() }}
        working-directory: modules/account-bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform test

  # The only required status check. Fails if any job failed or was cancelled.
  result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [checks, terraform]
    if: always()

    steps:
      - name: Check Job Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
